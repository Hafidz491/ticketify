<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <linearGradient id="festBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="festStage" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <rect width="600" height="480" rx="16" fill="url(#festBg)" stroke="#374151" stroke-width="2" />

  <!-- Layout Title Badge -->
  <rect x="20" y="20" width="210" height="26" rx="13" fill="#1f2937" stroke="#4b5563" stroke-width="1" />
  <text x="125" y="37" fill="#a78bfa" font-size="10" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">OPEN AIR FESTIVAL FIELD</text>

  <!-- Panggung Utama (Top) -->
  <rect x="130" y="60" width="340" height="52" rx="10" fill="url(#festStage)" stroke="#ffffff" stroke-width="1.5" />
  <text x="300" y="92" fill="#ffffff" font-size="14" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="2">★ FESTIVAL MAIN STAGE ★</text>

  <!-- Sound Stage Speakers Side Wings -->
  <rect x="90" y="65" width="32" height="42" rx="4" fill="#374151" stroke="#6b7280" />
  <text x="106" y="90" fill="#9ca3af" font-size="8" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">AUDIO</text>

  <rect x="478" y="65" width="32" height="42" rx="4" fill="#374151" stroke="#6b7280" />
  <text x="494" y="90" fill="#9ca3af" font-size="8" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">AUDIO</text>

  <!-- Barrier Buffer Line -->
  <line x1="80" y1="124" x2="520" y2="124" stroke="#e11d48" stroke-width="2" stroke-dasharray="4 4" />
  <text x="300" y="120" fill="#f43f5e" font-size="8" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">SAFETY BARRIER BUFFER ZONE</text>

  <!-- VIP Front Row Left & Right -->
  <rect x="80" y="135" width="210" height="75" rx="8" fill="#8b5cf6" fill-opacity="0.25" stroke="#8b5cf6" stroke-width="1.5" />
  <text x="185" y="170" fill="#c4b5fd" font-size="11" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle">VIP ZONE (LEFT)</text>
  <text x="185" y="186" fill="#a78bfa" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">Exclusive Front Access</text>

  <rect x="310" y="135" width="210" height="75" rx="8" fill="#8b5cf6" fill-opacity="0.25" stroke="#8b5cf6" stroke-width="1.5" />
  <text x="415" y="170" fill="#c4b5fd" font-size="11" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle">VIP ZONE (RIGHT)</text>
  <text x="415" y="186" fill="#a78bfa" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">Exclusive Front Access</text>

  <!-- Walkway / Access aisle -->
  <line x1="300" y1="135" x2="300" y2="210" stroke="#4b5563" stroke-width="2" stroke-dasharray="2 2" />

  <!-- General Admission Field (Festival Regular) -->
  <rect x="80" y="225" width="440" height="135" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
  <text x="300" y="280" fill="#93c5fd" font-size="13" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle" letter-spacing="1">REGULAR FESTIVAL (GA STANDING)</text>
  <text x="300" y="300" fill="#60a5fa" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">Area Berdiri Luas & Bebas Bersorak</text>

  <!-- FOH Sound & Lighting Booth -->
  <rect x="250" y="315" width="100" height="32" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1" />
  <text x="300" y="335" fill="#94a3b8" font-size="9" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">FOH SOUND / LIGHT</text>

  <!-- Rear Facilities: Food & Beverages, Merch, Entrance -->
  <rect x="80" y="375" width="135" height="45" rx="6" fill="#1f2937" stroke="#374151" />
  <text x="147" y="402" fill="#d1d5db" font-size="9" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">🍔 FOOD &amp; DRINK</text>

  <rect x="232" y="375" width="135" height="45" rx="6" fill="#1f2937" stroke="#374151" />
  <text x="300" y="402" fill="#d1d5db" font-size="9" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">👕 MERCHANDISE</text>

  <rect x="385" y="375" width="135" height="45" rx="6" fill="#1f2937" stroke="#374151" />
  <text x="452" y="402" fill="#d1d5db" font-size="9" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">🏥 MEDIS &amp; TOILET</text>

  <!-- Entrance Gate at Bottom -->
  <rect x="220" y="435" width="160" height="25" rx="12" fill="#059669" />
  <text x="300" y="451" fill="#ffffff" font-size="10" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle">▼ GERBANG MASUK UTAMA ▼</text>
</svg>
