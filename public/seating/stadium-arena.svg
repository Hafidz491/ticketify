<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="stageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="480" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Stadium Outer Oval Boundary -->
  <ellipse cx="300" cy="245" rx="270" ry="195" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 4" />

  <!-- Outer Upper Tribune CAT 3 (Top arc) -->
  <path d="M 60,240 A 245,175 0 0,1 540,240" fill="none" stroke="#64748b" stroke-width="24" stroke-linecap="round" opacity="0.35" />
  <text x="300" y="85" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="1">TRIBUN ATAS • CAT 3</text>

  <!-- Middle Tribune CAT 2 -->
  <path d="M 85,250 A 215,145 0 0,1 515,250" fill="none" stroke="#0ea5e9" stroke-width="22" stroke-linecap="round" opacity="0.5" />
  <text x="300" y="125" fill="#38bdf8" font-size="10" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="1">TRIBUN TENGAH • CAT 2</text>

  <!-- Lower Tribune CAT 1 (Sides) -->
  <path d="M 115,260 A 185,115 0 0,1 210,180" fill="none" stroke="#10b981" stroke-width="26" stroke-linecap="round" opacity="0.6" />
  <text x="145" y="210" fill="#34d399" font-size="9" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">CAT 1 B</text>

  <path d="M 390,180 A 185,115 0 0,1 485,260" fill="none" stroke="#10b981" stroke-width="26" stroke-linecap="round" opacity="0.6" />
  <text x="455" y="210" fill="#34d399" font-size="9" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">CAT 1 A</text>

  <!-- Festival Ground Area (Standing) -->
  <rect x="180" y="215" width="240" height="90" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <text x="300" y="260" fill="#f8fafc" font-size="12" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle" letter-spacing="1">FESTIVAL (STANDING)</text>
  <text x="300" y="278" fill="#94a3b8" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">Area Bebas Berdiri</text>

  <!-- FOH Sound & Lighting Tower -->
  <rect x="270" y="320" width="60" height="24" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1" />
  <text x="300" y="336" fill="#64748b" font-size="8" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">FOH TOWER</text>

  <!-- VIP PIT Front of Stage -->
  <rect x="200" y="355" width="200" height="42" rx="8" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b" stroke-width="2" />
  <text x="300" y="380" fill="#fbbf24" font-size="11" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle" letter-spacing="1.2">VIP PIT (FRONT ROW)</text>

  <!-- Catwalk Thrust -->
  <rect x="285" y="398" width="30" height="15" fill="#38bdf8" opacity="0.8" />

  <!-- MAIN STAGE -->
  <rect x="170" y="414" width="260" height="44" rx="8" fill="url(#stageGrad)" filter="url(#glow)" stroke="#ffffff" stroke-width="1.5" />
  <text x="300" y="440" fill="#ffffff" font-size="14" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="2">★ PANGGUNG UTAMA (MAIN STAGE) ★</text>

  <!-- Legend at Bottom Corner -->
  <g transform="translate(30, 420)">
    <circle cx="8" cy="8" r="5" fill="#f59e0b" />
    <text x="18" y="12" fill="#cbd5e1" font-size="9" font-family="system-ui, sans-serif">VIP Pit</text>
    <circle cx="80" cy="8" r="5" fill="#38bdf8" />
    <text x="90" y="12" fill="#cbd5e1" font-size="9" font-family="system-ui, sans-serif">Tribun</text>
    <circle cx="150" cy="8" r="5" fill="#10b981" />
    <text x="160" y="12" fill="#cbd5e1" font-size="9" font-family="system-ui, sans-serif">Festival</text>
  </g>

  <!-- Badge Header -->
  <rect x="20" y="20" width="180" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="110" y="37" fill="#38bdf8" font-size="10" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">STADIUM 360 LAYOUT</text>
</svg>
