<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <linearGradient id="theatreBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18121f" />
      <stop offset="100%" stop-color="#0a070f" />
    </linearGradient>
    <linearGradient id="theatreStage" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <rect width="600" height="480" rx="16" fill="url(#theatreBg)" stroke="#3f2d4d" stroke-width="2" />

  <!-- Layout Badge -->
  <rect x="20" y="20" width="220" height="26" rx="13" fill="#2d1f38" stroke="#5b3e70" stroke-width="1" />
  <text x="130" y="37" fill="#fbbf24" font-size="10" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">THEATER &amp; AUDITORIUM HALL</text>

  <!-- Stage (Top) -->
  <path d="M 120,65 L 480,65 Q 300,105 120,65 Z" fill="url(#theatreStage)" stroke="#ffffff" stroke-width="1.5" />
  <text x="300" y="82" fill="#0f172a" font-size="13" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="2">PANGGUNG TEATER (PROSCENIUM)</text>

  <!-- Orchestra Pit -->
  <path d="M 160,100 Q 300,125 440,100" fill="none" stroke="#6b7280" stroke-width="6" stroke-linecap="round" />
  <text x="300" y="118" fill="#9ca3af" font-size="8" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">ORCHESTRA PIT</text>

  <!-- Diamond VIP Stalls (Front Center) -->
  <path d="M 170,140 Q 300,165 430,140 L 415,200 Q 300,225 185,200 Z" fill="#d97706" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1.5" />
  <text x="300" y="175" fill="#fef3c7" font-size="11" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle">VIP DIAMOND SEATING</text>
  <text x="300" y="192" fill="#fde68a" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">Best Acoustics &amp; View (Numbered)</text>

  <!-- Ground Floor Stalls CAT 1 (Numbered Rows) -->
  <path d="M 130,220 Q 300,250 470,220 L 450,295 Q 300,325 150,295 Z" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5" />
  <text x="300" y="260" fill="#bae6fd" font-size="11" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle">CAT 1 • GROUND FLOOR (STALLS)</text>
  <text x="300" y="278" fill="#7dd3fc" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">Kursi Bernomor Nyaman</text>

  <!-- Royal Balcony Boxes Left & Right -->
  <rect x="50" y="170" width="55" height="120" rx="6" fill="#831843" fill-opacity="0.4" stroke="#f43f5e" stroke-width="1.2" />
  <text x="77" y="235" fill="#fecdd3" font-size="9" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle" transform="rotate(-90 77 235)">ROYAL BOX (L)</text>

  <rect x="495" y="170" width="55" height="120" rx="6" fill="#831843" fill-opacity="0.4" stroke="#f43f5e" stroke-width="1.2" />
  <text x="522" y="235" fill="#fecdd3" font-size="9" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle" transform="rotate(90 522 235)">ROYAL BOX (R)</text>

  <!-- Upper Balcony Tier CAT 2 (Elevated) -->
  <path d="M 90,320 Q 300,360 510,320 L 490,410 Q 300,450 110,410 Z" fill="#475569" fill-opacity="0.35" stroke="#94a3b8" stroke-width="1.5" />
  <text x="300" y="365" fill="#e2e8f0" font-size="12" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle">CAT 2 • UPPER BALCONY</text>
  <text x="300" y="383" fill="#cbd5e1" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">Pemandangan Penuh dari Ketinggian Teater</text>

  <!-- Legend -->
  <g transform="translate(140, 440)">
    <circle cx="8" cy="8" r="5" fill="#f59e0b" />
    <text x="18" y="12" fill="#cbd5e1" font-size="9" font-family="system-ui, sans-serif">VIP Diamond</text>
    <circle cx="110" cy="8" r="5" fill="#38bdf8" />
    <text x="120" y="12" fill="#cbd5e1" font-size="9" font-family="system-ui, sans-serif">CAT 1 Stalls</text>
    <circle cx="210" cy="8" r="5" fill="#94a3b8" />
    <text x="220" y="12" fill="#cbd5e1" font-size="9" font-family="system-ui, sans-serif">CAT 2 Balcony</text>
  </g>
</svg>
